- name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          # Spécifier où se trouvent les fichiers Gradle pour la gestion du cache
          cache-dependency-path: './votre-sous-dossier/**/*.gradle*'

      - name: Grant execute permission for gradlew
        working-directory: ./votre-sous-dossier
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./votre-sous-dossier
        run: ./gradlew assembleDebug
