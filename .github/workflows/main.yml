name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code source du dépôt (Étape indispensable pour éviter "No such file or directory")
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurer l'environnement Java (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Rendre le script gradlew exécutable
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Compiler l'application Android (APK Debug)
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 5. (Optionnel) Archiver l'APK généré pour le télécharger depuis GitHub
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
