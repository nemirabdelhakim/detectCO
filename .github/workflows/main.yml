name: Construire l'APK Android - Pose CO

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  apk:
    name: Compilation APK Android
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # 1. Récupération du projet
      - name: Récupérer les fichiers
        uses: actions/checkout@v4

      # 2. Installation de Node.js
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Installation de Java 17
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 4. Configuration du SDK Android
      # Ne pas utiliser android-actions/setup-android@v3
      - name: Configurer le SDK Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "ERREUR : SDK Android introuvable"
            exit 1
          fi

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERREUR : sdkmanager introuvable"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Installation des dépendances Node
      - name: Installer les dépendances
        run: npm ci

      # 6. Vérification de la configuration Capacitor
      - name: Vérifier la configuration Capacitor
        run: |
          if [ ! -f capacitor.config.json ]; then
            echo "ERREUR : capacitor.config.json introuvable"
            exit 1
          fi

          if [ ! -f scripts/patch-android.js ]; then
            echo "ERREUR : scripts/patch-android.js introuvable"
            exit 1
          fi

          cat capacitor.config.json

      # 7. Création du projet Android
      - name: Créer le projet Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "Le dossier Android existe déjà."
          fi

      # 8. Configuration Android
      - name: Configurer Android
        run: node scripts/patch-android.js

      # 9. Synchronisation Capacitor
      - name: Synchroniser l'application
        run: npx cap sync android

      # 10. Compilation APK Release
      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # 11. Vérification de l'APK
      - name: Vérifier le fichier APK
        run: |
          ls -lh android/app/build/outputs/apk/release/

      # 12. Publication de l'APK
      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Pose-CO-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
